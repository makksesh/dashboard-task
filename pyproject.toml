[project]
name = "mvp-task"
version = "0.1.0"
description = "Alpha production dashboard for preparation, welding demand and documents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "itsdangerous>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = ["httpx>=0.28,<1"]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
